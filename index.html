<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Compteur Manille (Base 60)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body { touch-action: manipulation; }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 28px;
      width: 28px;
      border-radius: 50%;
      background: #4F46E5;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 flex flex-col font-sans select-none">

  <!-- Header & Match Info -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-20 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-layer-group text-indigo-400 text-xl"></i>
        <h1 class="font-bold text-lg text-white">Manille <span class="text-xs text-indigo-400 font-normal">Base 60</span></h1>
      </div>
      
      <!-- Counter Rounds -->
      <div class="bg-slate-900 border border-slate-700 px-3 py-1 rounded-full text-sm font-semibold flex items-center gap-2">
        <span class="text-slate-400">Manche :</span>
        <span id="currentRoundDisplay" class="text-indigo-400 font-bold">1</span> / 12
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto w-full p-4 flex-1 flex flex-col gap-4">
    
    <!-- Warning Banner for Forced Roulés -->
    <div id="rouleWarningBanner" class="hidden bg-amber-500/20 border border-amber-500/50 text-amber-200 p-3 rounded-xl text-xs flex items-center gap-3">
      <i class="fa-solid fa-triangle-exclamation text-amber-400 text-lg"></i>
      <div>
        <span class="font-bold">Attention !</span> Il reste des "Roulés" obligatoires à effectuer avant la fin des 12 manches.
      </div>
    </div>

    <!-- Main Scoreboard -->
    <section class="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-xl flex flex-col gap-3">
      <div class="grid grid-cols-2 gap-3">
        <!-- Team A (Nous) -->
        <div class="flex flex-col items-center p-3 rounded-xl bg-slate-900/50 border border-slate-700/50 relative">
          <input type="text" id="teamAName" value="Nous" class="bg-transparent text-center font-bold text-indigo-300 text-base focus:outline-none w-full mb-1">
          <div id="teamAScore" class="text-4xl font-extrabold text-indigo-400 my-1">0</div>
          <div class="text-[11px] text-slate-400 mb-2">points nets</div>
          
          <!-- Roulé Badges Team A -->
          <div class="flex gap-1.5 mb-2">
            <button onclick="handleRouleClick('A', 1)" id="badgeA1" class="text-[10px] px-2 py-1 rounded-full border border-slate-700 bg-slate-800 text-slate-400 font-semibold transition-all flex items-center gap-1">
              Roulé 1 <i class="fa-solid fa-check hidden text-emerald-400"></i>
            </button>
            <button onclick="handleRouleClick('A', 2)" id="badgeA2" opacity-50 class="text-[10px] px-2 py-1 rounded-full border border-slate-700 bg-slate-800/50 text-slate-500 font-semibold transition-all flex items-center gap-1">
              Roulé 2 <i class="fa-solid fa-check hidden text-emerald-400"></i>
            </button>
          </div>

          <!-- Toggle Submenu Players -->
          <button onclick="togglePlayerMenu('A')" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium flex items-center gap-1 mt-1">
            <i class="fa-solid fa-users text-[10px]"></i> Joueurs <i id="arrowA" class="fa-solid fa-chevron-down text-[10px] transition-transform"></i>
          </button>
        </div>

        <!-- Team B (Eux) -->
        <div class="flex flex-col items-center p-3 rounded-xl bg-slate-900/50 border border-slate-700/50 relative">
          <input type="text" id="teamBName" value="Eux" class="bg-transparent text-center font-bold text-emerald-300 text-base focus:outline-none w-full mb-1">
          <div id="teamBScore" class="text-4xl font-extrabold text-emerald-400 my-1">0</div>
          <div class="text-[11px] text-slate-400 mb-2">points nets</div>

          <!-- Roulé Badges Team B -->
          <div class="flex gap-1.5 mb-2">
            <button onclick="handleRouleClick('B', 1)" id="badgeB1" class="text-[10px] px-2 py-1 rounded-full border border-slate-700 bg-slate-800 text-slate-400 font-semibold transition-all flex items-center gap-1">
              Roulé 1 <i class="fa-solid fa-check hidden text-emerald-400"></i>
            </button>
            <button onclick="handleRouleClick('B', 2)" id="badgeB2" class="text-[10px] px-2 py-1 rounded-full border border-slate-700 bg-slate-800/50 text-slate-500 font-semibold transition-all flex items-center gap-1">
              Roulé 2 <i class="fa-solid fa-check hidden text-emerald-400"></i>
            </button>
          </div>

          <!-- Toggle Submenu Players -->
          <button onclick="togglePlayerMenu('B')" class="text-xs text-emerald-400 hover:text-emerald-300 font-medium flex items-center gap-1 mt-1">
            <i class="fa-solid fa-users text-[10px]"></i> Joueurs <i id="arrowB" class="fa-solid fa-chevron-down text-[10px] transition-transform"></i>
          </button>
        </div>
      </div>

      <!-- Submenu Players Team A -->
      <div id="playerMenuA" class="hidden bg-slate-900/90 border border-slate-700 p-3 rounded-xl flex flex-col gap-2">
        <span class="text-[11px] font-bold text-indigo-400 uppercase tracking-wider">Joueurs - Nous</span>
        <div class="flex items-center justify-between gap-2">
          <input type="text" id="playerA1_name" value="Joueur 1" class="bg-slate-800 text-xs px-2 py-1 rounded border border-slate-700 text-slate-200 flex-1">
          <label class="flex items-center gap-1 cursor-pointer">
            <input type="checkbox" onchange="toggleDealer('A1')" id="dealer_A1" class="accent-indigo-500">
            <span id="label_dealer_A1" class="text-[10px] text-slate-400 font-medium">Carté ?</span>
          </label>
        </div>
        <div class="flex items-center justify-between gap-2">
          <input type="text" id="playerA2_name" value="Joueur 2" class="bg-slate-800 text-xs px-2 py-1 rounded border border-slate-700 text-slate-200 flex-1">
          <label class="flex items-center gap-1 cursor-pointer">
            <input type="checkbox" onchange="toggleDealer('A2')" id="dealer_A2" class="accent-indigo-500">
            <span id="label_dealer_A2" class="text-[10px] text-slate-400 font-medium">Carté ?</span>
          </label>
        </div>
      </div>

      <!-- Submenu Players Team B -->
      <div id="playerMenuB" class="hidden bg-slate-900/90 border border-slate-700 p-3 rounded-xl flex flex-col gap-2">
        <span class="text-[11px] font-bold text-
